<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b17">
<title>MindFlow — твой день, твои цели</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%237aa2ff'/%3E%3Cstop offset='1' stop-color='%239a6bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='10' fill='%230b1226'/%3E%3Cpath d='M9 33c-3-9 1-19 10-24 4-2 9-2 13 0-7 1-12 5-13 12-1 6 2 10 7 12-8 3-14 3-17 0z' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b17;--tx:#eef2ff;--tx2:#a6b0d2;--tx3:#6d789b;
  --line:rgba(130,150,255,.11);--line2:rgba(130,150,255,.22);
  --blue:#5b7cff;--violet:#9a6bff;--green:#2fd5a0;--amber:#ffb547;--red:#ff5d73;
  --r:1.25rem;
}
*{box-sizing:border-box;margin:0;padding:0}
*{scrollbar-width:thin;scrollbar-color:rgba(130,150,255,.25) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(130,150,255,.22);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
html{font-size:clamp(13px,calc(.45vw + 7.5px),17px);color-scheme:dark}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--tx);height:100vh;overflow-x:auto;overflow-y:hidden;-webkit-font-smoothing:antialiased;
  background:
   radial-gradient(1100px 560px at 18% -12%,rgba(80,100,255,.17),transparent 60%),
   radial-gradient(900px 520px at 100% 0%,rgba(150,90,255,.13),transparent 55%),
   radial-gradient(800px 600px at 55% 115%,rgba(40,200,170,.07),transparent 60%),var(--bg);}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.ic{flex:none;display:block}
h1,h2,h3,.h{font-family:Manrope,Inter,sans-serif}
.panel{background:linear-gradient(180deg,rgba(23,32,60,.86),rgba(13,20,39,.86));border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 24px 50px -24px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.045);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.app{display:grid;grid-template-columns:16rem minmax(0,1fr) 23rem;gap:1.1rem;padding:1.1rem;height:100vh;min-width:1100px}
.sub{color:var(--tx2);font-size:.82rem}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;padding:1.3rem 1.1rem 1.1rem;min-height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:.8rem;padding:0 .4rem 1.5rem}
.brand svg{width:2.5rem;height:2.5rem;filter:drop-shadow(0 6px 14px rgba(110,120,255,.55))}
.b-name{font-family:Manrope;font-weight:800;font-size:1.2rem;letter-spacing:.2px}
.b-tag{font-size:.72rem;color:var(--tx3);margin-top:.1rem}
.nav{display:flex;flex-direction:column;gap:.3rem}
.nav-i{display:flex;align-items:center;gap:.85rem;padding:.82rem .95rem;border-radius:.9rem;color:var(--tx2);font-weight:500;font-size:.93rem;transition:.2s;text-align:left;position:relative}
.nav-i:hover{background:rgba(120,140,255,.08);color:var(--tx)}
.nav-i.on{background:linear-gradient(90deg,#3151d8,#4766f1);color:#fff;box-shadow:0 12px 26px -12px rgba(70,100,255,.9),inset 0 1px 0 rgba(255,255,255,.2)}
.badge{margin-left:auto;font-style:normal;font-size:.72rem;font-weight:600;background:rgba(120,140,255,.17);color:var(--tx2);padding:.12rem .52rem;border-radius:.55rem}
.nav-i.on .badge{background:rgba(255,255,255,.2);color:#fff}
.qcard{position:relative;margin-top:auto;height:8.4rem;border-radius:1.05rem;overflow:hidden;cursor:pointer;border:1px solid var(--line);box-shadow:0 14px 30px -14px rgba(0,0,0,.7)}
.qcard .scene{position:absolute;inset:0;width:100%;height:100%}
.qcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,26,.1),rgba(6,10,26,.55))}
.qcard p{position:absolute;left:.9rem;top:.8rem;right:.9rem;z-index:2;font-size:.8rem;line-height:1.35;font-weight:500;text-shadow:0 2px 10px rgba(0,0,0,.6);transition:opacity .3s}
.heart{position:absolute;right:.6rem;bottom:.6rem;z-index:3;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:rgba(10,16,36,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);transition:.2s;color:#dfe5ff}
.heart:hover{transform:scale(1.1)}
.heart.on{color:#ff5d82}.heart.on svg{fill:#ff5d82}
.me{display:flex;align-items:center;gap:.8rem;margin-top:1rem;padding:1rem .3rem 0;border-top:1px solid var(--line)}
.ava{width:2.7rem;height:2.7rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:Manrope;background:linear-gradient(135deg,#ffb27a,#e0527a);box-shadow:0 0 0 2px rgba(255,255,255,.12),0 8px 18px -8px rgba(224,82,122,.8)}
.me-t{min-width:0;flex:1}.me-t b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me-t small{color:var(--tx3);font-size:.75rem}
.icon-btn{width:2.1rem;height:2.1rem;border-radius:.7rem;display:grid;place-items:center;color:var(--tx2);transition:.2s}
.icon-btn:hover{background:rgba(120,140,255,.12);color:#fff}

/* ---------- center ---------- */
.center{min-height:0;min-width:0;position:relative}
.view{display:none;height:100%;overflow-y:auto;flex-direction:column;gap:1.1rem;padding-right:.2rem}
.view.active{display:flex}
.view>*{flex-shrink:0}
.hero{position:relative;height:13.8rem;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 24px 50px -24px rgba(0,0,0,.7)}
.hero .scene{position:absolute;inset:0;width:100%;height:100%}
.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,10,28,.62),rgba(6,10,28,.12) 62%,transparent),linear-gradient(0deg,rgba(7,11,23,.35),transparent 40%)}
.hero-in{position:absolute;left:2.2rem;top:50%;transform:translateY(-52%);max-width:62%}
.hero h1{display:flex;align-items:center;gap:.9rem;font-size:2.15rem;font-weight:800;letter-spacing:-.2px;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.hero h1 .gi{width:2.7rem;height:2.7rem;flex:none;filter:drop-shadow(0 0 14px rgba(255,200,90,.55))}
.hero p{margin-top:.7rem;font-size:1.04rem;line-height:1.45;color:#eef0ff;max-width:25rem;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.hero-chip{position:absolute;right:1.2rem;bottom:1.1rem;display:flex;align-items:center;gap:.7rem;padding:.6rem .95rem;border-radius:.95rem;background:rgba(10,16,38,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);font-size:.82rem}
.hero-chip b{font-family:Manrope;font-size:1rem}
.mini-bar{width:5.5rem;height:.4rem;border-radius:1rem;background:rgba(255,255,255,.16);overflow:hidden}
.mini-bar i{display:block;height:100%;border-radius:1rem;background:linear-gradient(90deg,#6c8cff,#2fd5a0);transition:width .6s}

.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem}
.p-head h2{font-size:1.25rem;font-weight:700}
.p-head .sub{margin-top:.25rem}
.p-act{display:flex;align-items:center;gap:.7rem}
.count{font-size:.8rem;color:var(--tx2);background:rgba(120,140,255,.1);padding:.5rem .85rem;border-radius:.75rem;border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.62rem 1.05rem;border-radius:.8rem;font-weight:600;font-size:.88rem;transition:.2s;border:1px solid transparent}
.btn.primary{background:linear-gradient(135deg,#3c58e6,#5f6bf5);color:#fff;box-shadow:0 10px 22px -10px rgba(80,100,255,.9),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn.ghost{background:rgba(120,140,255,.08);border-color:var(--line);color:var(--tx2)}
.btn.ghost:hover{color:#fff;background:rgba(120,140,255,.15)}
.btn.danger{background:rgba(255,93,115,.12);color:#ff8a9a;border-color:rgba(255,93,115,.25)}
.btn.sm{padding:.45rem .8rem;font-size:.8rem}
.tasks-p,.stats-p,.pad-p{padding:1.35rem 1.4rem}
.tlist{border:1px solid var(--line);border-radius:1rem;overflow:hidden;background:rgba(8,13,28,.35)}
.task{display:flex;align-items:center;gap:.85rem;padding:0 1rem 0 .9rem;height:3.35rem;border-bottom:1px solid var(--line);position:relative;transition:background .2s}
.task:last-child{border-bottom:0}
.task:hover{background:rgba(120,140,255,.06)}
.task.now{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 70%)}
.chk{flex:none;width:1.4rem;height:1.4rem;border-radius:50%;border:1.6px solid rgba(160,175,230,.45);display:grid;place-items:center;transition:.25s;color:#fff}
.chk:hover{border-color:var(--blue);box-shadow:0 0 0 4px rgba(91,124,255,.15)}
.chk svg{width:.85rem;height:.85rem;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:.25s}
.done>.chk,.nt.done .chk{background:linear-gradient(135deg,#4c6bff,#8a6bff);border-color:transparent;box-shadow:0 6px 14px -6px rgba(91,110,255,.9)}
.done>.chk svg,.nt.done .chk svg{opacity:1;transform:none}
.t-bar{width:.18rem;height:1.55rem;border-radius:1rem;background:var(--c);box-shadow:0 0 12px var(--c)}
.t-main{display:flex;align-items:center;gap:.7rem;min-width:0;flex:1}
.t-title{font-weight:500;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done .t-title{color:var(--tx3);text-decoration:line-through;text-decoration-color:rgba(160,175,230,.4)}
.pill{flex:none;font-size:.72rem;font-weight:600;padding:.2rem .65rem;border-radius:.55rem;color:color-mix(in srgb,var(--c) 70%,#fff);background:color-mix(in srgb,var(--c) 17%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.now-b{flex:none;font-size:.66rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#7dffd4;background:rgba(47,213,160,.14);padding:.18rem .5rem;border-radius:.5rem;animation:pulse 2s infinite}
.t-time{font-size:.84rem;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.task.late .t-time{color:var(--amber)}
.t-ico{color:var(--tx3);width:1.6rem;display:grid;place-items:center}
.kebab{width:1.8rem;height:1.8rem;border-radius:.55rem;display:grid;place-items:center;color:var(--tx3);transition:.2s}
.kebab:hover{background:rgba(120,140,255,.14);color:#fff}
.empty{padding:2.2rem 1rem;text-align:center;color:var(--tx3);font-size:.9rem}
.empty b{display:block;color:var(--tx2);font-size:1rem;margin-bottom:.35rem}

.select{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;border-radius:.8rem;background:rgba(120,140,255,.08);border:1px solid var(--line);font-size:.86rem;color:var(--tx2);min-width:7.8rem;justify-content:space-between;transition:.2s}
.select:hover{color:#fff;border-color:var(--line2)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
.stat{position:relative;padding:1rem 1.05rem;border-radius:1rem;border:1px solid var(--line);background:linear-gradient(180deg,rgba(28,38,70,.55),rgba(14,21,42,.55));cursor:pointer;transition:.25s;min-width:0}
.stat:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 14px 28px -16px rgba(60,90,255,.5)}
.s-lbl{font-size:.8rem;color:var(--tx2)}
.s-val{margin:.4rem 0 .65rem;font-family:Manrope;font-weight:700;font-size:1.55rem;white-space:nowrap}
.s-val span{font-weight:500;color:var(--tx2);font-size:1.3rem}
.s-val small{font-size:.95rem;font-weight:600;color:var(--tx)}
.bar{height:.34rem;border-radius:1rem;background:rgba(130,150,255,.15);overflow:hidden;width:78%}
.bar i{display:block;height:100%;border-radius:1rem;background:linear-gradient(90deg,#4a6bff,#7d9bff);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.v i{background:linear-gradient(90deg,#8a5bff,#b58bff)}
.s-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:.45rem}
.s-pct{font-size:.8rem;font-weight:600;color:#7d9bff}.s-pct.v{color:#b58bff}
.s-d{font-size:.82rem;font-weight:600;white-space:nowrap}
.s-d.up{color:var(--green)}.s-d.dn{color:var(--red)}.s-d.eq{color:var(--tx3)}
.s-d em{font-style:normal;font-weight:400;color:var(--tx3);font-size:.7rem;margin-left:.3rem}
.s-ico{position:absolute;right:.95rem;bottom:.95rem;color:#8ba3ff;display:grid;place-items:center}
.stat-low{display:grid;grid-template-columns:1.18fr 1fr;gap:.9rem;margin-top:.9rem}
.sub-card{border:1px solid var(--line);border-radius:1rem;background:linear-gradient(180deg,rgba(28,38,70,.4),rgba(14,21,42,.4));padding:1rem 1.1rem;min-width:0}
.sub-card h3{font-size:.95rem;font-weight:700}
.sc-head{display:flex;align-items:center;gap:.6rem;color:var(--tx2);margin-bottom:.4rem}.sc-head h3{color:var(--tx)}
.chart{position:relative;height:9.3rem}
.chart svg{display:block;overflow:visible}
.ch-tip{position:absolute;pointer-events:none;transform:translate(-50%,-100%);padding:.28rem .65rem;border-radius:.6rem;background:rgba(40,54,100,.92);border:1px solid var(--line2);font-family:Manrope;font-weight:700;font-size:.9rem;text-align:center;transition:left .25s,top .25s;box-shadow:0 10px 20px -8px rgba(0,0,0,.6);white-space:nowrap}
.ch-tip small{display:block;font-family:Inter;font-weight:400;font-size:.62rem;color:var(--tx2)}
#pm{transition:transform .25s}
.goal-card{cursor:pointer}
.goal-card:hover{border-color:var(--line2)}
.goal-body{display:flex;align-items:center;gap:1.4rem;margin-top:.5rem;height:8.3rem}
.donut{position:relative;width:7.8rem;height:7.8rem;flex:none}
.donut svg{width:100%;height:100%}
.donut circle{fill:none;stroke-width:10}
.arc-t{opacity:.2}
.boot .arc{animation:dash 1.2s cubic-bezier(.2,.8,.2,1) both}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-c b{font-family:Manrope;font-size:1.25rem;font-weight:700}.donut-c small{font-size:.66rem;color:var(--tx3)}
.legend{list-style:none;flex:1;display:flex;flex-direction:column;gap:.62rem;font-size:.82rem;color:var(--tx2)}
.legend li{display:flex;align-items:center;gap:.6rem}.legend i{width:.55rem;height:.55rem;border-radius:50%;flex:none}.legend b{margin-left:auto;color:var(--tx);font-weight:600}.legend span{flex:1}

/* ---------- rail ---------- */
.rail{display:flex;flex-direction:column;gap:1.1rem;overflow-y:auto;min-height:0;padding-right:.2rem}
.rail>*{flex-shrink:0}
.clock-p{padding:1.25rem 1.4rem 1rem;display:grid;grid-template-columns:1fr auto;gap:.2rem 1rem;align-items:center}
.time{font-family:Manrope;font-weight:800;font-size:3.1rem;line-height:1;letter-spacing:-1px;display:flex;align-items:baseline;font-variant-numeric:tabular-nums}
.colon{animation:blink 1s steps(2,start) infinite;margin:0 .05em;position:relative;top:-.05em}
.time small{font-size:1.05rem;font-weight:600;color:var(--tx3);margin-left:.5rem;letter-spacing:0}
.date{margin-top:.7rem;font-size:1.02rem;color:#dfe5ff}
.dow{font-size:.88rem;color:var(--tx2);margin-top:.15rem}
.w{display:flex;align-items:center;gap:.8rem;cursor:pointer;justify-self:end}
.w-ico{width:3.7rem;height:3.7rem;filter:drop-shadow(0 0 16px rgba(255,190,80,.35))}
.w-ico svg{width:100%;height:100%}
.w-t b{display:block;font-family:Manrope;font-size:1.75rem;font-weight:700;line-height:1.05}
.w-t span{display:block;font-size:.95rem;margin-top:.25rem;color:#e6ebff}
.w-t small{display:block;font-size:.78rem;color:var(--tx2);margin-top:.1rem;max-width:7.5rem}
.w-upd{grid-column:1/-1;display:flex;align-items:center;gap:.45rem;font-size:.68rem;color:var(--tx3);margin-top:.55rem;padding-top:.6rem;border-top:1px solid var(--line)}
.w-upd i{width:.4rem;height:.4rem;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.w-upd.stale i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.cal-p{padding:1.2rem 1.25rem 1.1rem}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.cal-h h3{font-size:1.1rem;font-weight:700;cursor:pointer}
.cal-nav{display:flex;gap:.3rem}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-w span{text-align:center;font-size:.72rem;color:var(--tx3);padding:.35rem 0 .5rem;font-weight:500}
.cd{position:relative;height:2.45rem;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;color:#e2e7ff;border-radius:.8rem;transition:.18s}
.cd:hover{background:rgba(120,140,255,.1)}
.cd.o{color:var(--tx3);opacity:.55}
.cd.today{box-shadow:inset 0 0 0 1.5px rgba(91,124,255,.7)}
.cd.sel{background:linear-gradient(135deg,#5877ff,#6d70ff);color:#fff;font-weight:700;box-shadow:0 8px 20px -6px rgba(91,124,255,.9);border-radius:50%;width:2.5rem;height:2.5rem;margin:auto}
.dots{position:absolute;bottom:.18rem;display:flex;gap:.17rem}
.dots i{width:.22rem;height:.22rem;border-radius:50%}
.tl-p,.nt-p{padding:1.2rem 1.35rem}
.tl-p h3,.nt-p h3{font-size:1.05rem;font-weight:700;margin-bottom:.9rem}
.tl{position:relative}
.tl-i{position:relative;display:grid;grid-template-columns:2.8rem 1fr;gap:.9rem;padding:0 0 1rem 1.4rem}
.tl-i::before{content:"";position:absolute;left:0;top:.28rem;width:.62rem;height:.62rem;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent),0 0 12px var(--c)}
.tl-i::after{content:"";position:absolute;left:.27rem;top:1.05rem;bottom:-.1rem;width:2px;background:linear-gradient(var(--c),var(--n,var(--c)));opacity:.55;border-radius:2px}
.tl-i:last-child{padding-bottom:0}.tl-i:last-child::after{display:none}
.tl-t{font-size:.82rem;color:var(--tx2);font-variant-numeric:tabular-nums;padding-top:.05rem}
.tl-n{font-size:.88rem;font-weight:500;line-height:1.25}
.tl-s{font-size:.74rem;color:var(--tx3);margin-top:.15rem}
.tl-i.done .tl-n{color:var(--tx3);text-decoration:line-through;text-decoration-color:rgba(160,175,230,.35)}
.nt-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem}
.nt-h h3{display:flex;align-items:center;gap:.7rem;margin:0}
.nt{display:flex;align-items:center;gap:.8rem;padding:.55rem .1rem;font-size:.86rem;color:#dfe5ff;position:relative;border-radius:.6rem}
.nt .chk{width:1.15rem;height:1.15rem}.nt .chk svg{width:.7rem;height:.7rem}
.nt span{flex:1;min-width:0;word-break:break-word;outline:0}
.nt.done span{color:var(--tx3);text-decoration:line-through}
.nt .x{opacity:0;color:var(--tx3);width:1.5rem;height:1.5rem;border-radius:.5rem;display:grid;place-items:center;transition:.2s}
.nt:hover .x{opacity:1}.nt .x:hover{color:var(--red);background:rgba(255,93,115,.12)}
.nt-add{display:flex;align-items:center;gap:.6rem;margin-top:.6rem;padding:.7rem .9rem;border:1px solid var(--line);border-radius:.9rem;background:rgba(8,13,28,.4);color:var(--tx3);transition:.2s}
.nt-add:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,124,255,.14);color:var(--tx2)}
.nt-add input{flex:1;background:none;border:0;outline:0;font-size:.86rem}
.nt-add input::placeholder{color:var(--tx3)}

/* ---------- other views ---------- */
.v-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.v-head h2{font-size:1.6rem;font-weight:800}
.tabs{display:inline-flex;padding:.25rem;border-radius:.9rem;background:rgba(120,140,255,.08);border:1px solid var(--line);gap:.15rem}
.tab{padding:.45rem .95rem;border-radius:.65rem;font-size:.84rem;color:var(--tx2);font-weight:500;transition:.2s;white-space:nowrap}

const hrs=m=>{if(m<60)return m+' мин';const h=m/60;if(Number.isInteger(h))return h+' '+plural(h,'час','часа','часов');return String(+h.toFixed(1)).replace('.',',')+' часа'};

    case'snow':b=cloud('wdg','translate(0,-6)')+'<g fill="#fff"><circle cx="24" cy="50" r="2.200"/><circle cx="33" cy="54" r="2.200"/><circle cx="42" cy="50" r="2.200"/></g>';break;
    case'storm':b=cloud('wdg','translate(0,-6)')+'<path d="M34 40l-7 11h6l-3 9 10-13h-6l3-7z" fill="#ffd23f"/>';break;
    default:b=cloud();
  }
  return`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${defs}${b}</svg>`;
}
function wInfo(c,day){
  if(c===0)return{k:day?'clear':'moon',t:day?'Ясно':'Ясная ночь'};
  if(c===1)return{k:day?'partly':'moonCloud',t:'Малооблачно'};
  if(c===2)return{k:day?'partly':'moonCloud',t:'Переменная облачность'};
  if(c===3)return{k:'cloud',t:'Пасмурно'};
  if(c===45||c===48)return{k:'fog',t:'Туман'};
  if(c>=51&&c<=57)return{k:'rain',t:'Морось'};
  if(c>=61&&c<=67)return{k:'rain',t:'Дождь'};
  if(c>=71&&c<=77)return{k:'snow',t:'Снег'};
  if(c>=80&&c<=82)return{k:'rain',t:'Ливень'};
  if(c===85||c===86)return{k:'snow',t:'Снегопад'};
  if(c>=95)return{k:'storm',t:'Гроза'};
  return{k:'cloud',t:'Облачно'};
}

/* =====================  weather (Open-Meteo, cache 60 min)  ===================== */
const WTTL=60*60*1000;let wBusy=false,wNextTry=0;
function applyWeather(rec,stale){
  const i=wInfo(rec.code,rec.isDay);
  $('#wIcon').innerHTML=wIcon(i.k);$('#wTemp').textContent=fmtT(rec.temp);$('#wCity').textContent=state.settings.loc.name;$('#wDesc').textContent=i.t;
  const d=new Date(rec.ts),u=$('#wUpd');u.className='w-upd '+(stale?'stale':'ok');
  u.innerHTML='<i></i>'+(stale?'Нет связи · данные от ':'Обновлено в ')+pad(d.getHours())+':'+pad(d.getMinutes())+' · Open-Meteo';
}
async function refreshWeather(force){
  const loc=state.settings.loc,c=lsGet(WKEY),same=!!c&&c.lat===loc.lat&&c.lon===loc.lon;
  /* есть ли свежие данные (<60 мин)? тогда берём из памяти браузера */
  if(same&&!force&&Date.now()-c.ts<WTTL){applyWeather(c);return}
  if(wBusy)return;wBusy=true;
  try{
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),12000);
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code,is_day&timezone=auto`,{signal:ac.signal});
    clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json(),cur=j.current;if(!cur)throw new Error('no data');
    const rec={ts:Date.now(),lat:loc.lat,lon:loc.lon,temp:cur.temperature_2m,code:cur.weather_code,isDay:cur.is_day};
    lsSet(WKEY,rec);applyWeather(rec);wNextTry=0;
  }catch(e){
    wNextTry=Date.now()+5*60*1000;
    if(same)applyWeather(c,true);
    else{$('#wTemp').textContent='--°';$('#wDesc').textContent='Нет данных';$('#wCity').textContent=loc.name;$('#wUpd').className='w-upd stale';$('#wUpd').innerHTML='<i></i>Не удалось получить погоду — повтор через 5 мин';}
  }finally{wBusy=false}
}
function weatherCheck(){
  if(wBusy||Date.now()<wNextTry)return;
  const loc=state.settings.loc,c=lsGet(WKEY);
  if(!c||c.lat!==loc.lat||c.lon!==loc.lon||Date.now()-c.ts>=WTTL)refreshWeather();
}

/* productivity line chart (last 7 days) */
let chartPts=[],chartVals=[];
function smoothPath(p,t,b){
  let d=`M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)}`;
  for(let i=0;i<p.length-1;i++){
    const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2,cl=v=>Math.max(t,Math.min(b,v));
    d+=` C${(p1.x+(p2.x-p0.x)/6).toFixed(1)},${cl(p1.y+(p2.y-p0.y)/6).toFixed(1)} ${(p2.x-(p3.x-p1.x)/6).toFixed(1)},${cl(p2.y-(p3.y-p1.y)/6).toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}
function renderChart(){
  const box=$('#prodChart');if(!box||!box.clientWidth)return;
  const W=box.clientWidth,H=box.clientHeight||148,px=18,top=34,bot=26,t0=parseYmd(todayStr);
  chartVals=[...Array(7)].map((_,i)=>{const d=addDays(t0,i-6),s=dayStat(ymd(d));return{pct:s.tot?Math.round(s.done/s.tot*100):0,tot:s.tot,dn:s.done,d}});
  const step=(W-px*2)/6,Y=v=>top+(H-top-bot)*(1-v/100);
  chartPts=chartVals.map((v,i)=>({x:px+i*step,y:Y(v.pct)}));
  const line=smoothPath(chartPts,top,H-bot),yb=H-bot,area=line+` L${chartPts[6].x.toFixed(1)},${yb} L${chartPts[0].x.toFixed(1)},${yb} Z`;
  const grid=[0,50,100].map(v=>`<line x1="${px}" x2="${W-px}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(130,150,255,.1)" stroke-dasharray="3 5"/>`).join('');
  const labels=chartVals.map((v,i)=>`<text id="xl${i}" x="${chartPts[i].x.toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="11" font-family="Inter,sans-serif" fill="${i===ui.hi?'#dfe5ff':'#6d789b'}">${WD_S[v.d.getDay()]}</text>`).join('');
  box.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="pa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c84ff" stop-opacity=".38"/><stop offset="1" stop-color="#6c84ff" stop-opacity="0"/></linearGradient><linearGradient id="pl" x1="0" x2="1"><stop offset="0" stop-color="#7a8dff"/><stop offset="1" stop-color="#9d7bff"/></linearGradient></defs>
   ${grid}<path class="parea" d="${area}" fill="url(#pa)"/><path class="pl" pathLength="1" d="${line}" fill="none" stroke="url(#pl)" stroke-width="2.4" stroke-linecap="round"/>
   <g id="pm"><line id="pmv" x1="0" x2="0" y1="0" y2="${yb}" stroke="rgba(150,165,255,.35)" stroke-dasharray="3 4" /><circle r="9" fill="rgba(110,130,255,.22)"/><circle r="4.8" fill="#8aa0ff" stroke="#fff" stroke-width="2"/></g>${labels}</svg><div class="ch-tip" id="chTip"></div>`;
  setHi(ui.hi,true);
}
function setHi(i,instant){

/* ---- Files (IndexedDB) ---- */
let DBP=null;
function db(){if(!DBP)DBP=new Promise((res,rej)=>{try{const r=indexedDB.open('mindflow',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return DBP}
const idb=(mode,fn)=>db().then(d=>new Promise((res,rej)=>{const tx=d.transaction('files',mode),r=fn(tx.objectStore('files'));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)}));
const fmtSize=b=>b<1024?b+' Б':b<1048576?(b/1024).toFixed(1)+' КБ':(b/1048576).toFixed(1)+' МБ';

  $('#v-files').innerHTML=`<div class="v-head"><h2>Файлы</h2><label class="btn primary" style="cursor:pointer">${ic('upload',16)}Загрузить<input type="file" id="fileIn" multiple hidden></label></div>

    return`<div class="f-row"><div class="f-ico">${esc(ext)}</div><div class="f-n"><b>${esc(f.name)}</b><small>${fmtSize(f.size)} · ${d.getDate()} ${MONTHS_G[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}</small></div><button class="icon-btn" data-act="fileDl" data-id="${f.id}" title="Скачать">${ic('download',18)}</button><button class="icon-btn" data-act="fileDel" data-id="${f.id}" title="Удалить">${ic('trash',18)}</button></div>`}).join(''):'<div class="empty"><b>Пока нет файлов</b>Загрузи документы, чтобы они были под рукой</div>';
}

/* ---- Statistics view ---- */
function streak(){let d=parseYmd(todayStr);if(!dayStat(ymd(d)).done)d=addDays(d,-1);let n=0;while(n<400&&dayStat(ymd(d)).done>0){n++;d=addDays(d,-1)}return n}
function renderStatsView(){
  const N=ui.sr,t0=parseYmd(todayStr),days=[...Array(N)].map((_,i)=>ymd(addDays(t0,i-N+1))),prevDays=[...Array(N)].map((_,i)=>ymd(addDays(t0,i-2*N+1)));
  const S=days.map(dayStat),P=prevDays.map(dayStat),sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
  const done=sum(S,'done'),tot=sum(S,'tot'),focus=sum(S,'focus'),pdone=sum(P,'done'),ptot=sum(P,'tot'),pfocus=sum(P,'focus');
  const rate=tot?Math.round(done/tot*100):0,prate=ptot?Math.round(pdone/ptot*100):0,dd=deltaPct(done,pdone),fd=deltaPct(focus,pfocus),rd=rate-prate;
  const best=S.reduce((m,x)=>x.done>m?x.done:m,0),maxT=Math.max(1,...S.map(x=>x.tot));
  const bars=S.map((s,i)=>{const d=parseYmd(days[i]),lab=N<=14?WD_S[d.getDay()]:(i%5===0||i===N-1?d.getDate():'');
    return`<div class="bcol" data-tip="${esc(d.getDate()+' '+MONTHS_G[d.getMonth()]+' · выполнено '+s.done+' из '+s.tot+' · фокус '+fmtDur(s.focus))}"><div class="bw"><div class="bt" style="height:${s.tot/maxT*100}%"></div><div class="bd" style="height:${s.done/maxT*100}%"></div></div><div class="bl">${lab}</div></div>`}).join('');
  const inRange=new Set(days),tagS=Object.keys(TAGS).map(k=>{let t=0,d=0,f=0;state.tasks.forEach(x=>{if(x.tag===k&&inRange.has(x.date)){t++;if(x.done){d++;f+=dur(x)}}});return{k,t,d,f,...TAGS[k]}});
  const maxF=Math.max(1,...tagS.map(x=>x.f));
  /* heatmap */
  const mon=addDays(t0,-((t0.getDay()+6)%7)),hs=addDays(mon,-35);let hmax=1;const hcells=[];
  for(let w=0;w<6;w++)for(let d=0;d<7;d++){const dt=addDays(hs,w*7+d),k=ymd(dt),fut=k>todayStr,st=fut?{done:0,tot:0}:dayStat(k);hmax=Math.max(hmax,st.done);hcells[d*6+w]={dt,fut,st}}
  const rowsL=['Пн','','Ср','','Пт','',''];let heat='';
  for(let d=0;d<7;d++){heat+=`<span class="hl">${rowsL[d]}</span>`;for(let w=0;w<6;w++){const c=hcells[d*6+w],l=c.st.done?Math.min(4,Math.ceil(c.st.done/hmax*4)):0;
    heat+=`<div class="hc ${c.fut?'f':''}" data-l="${l}" data-tip="${esc(c.dt.getDate()+' '+MONTHS_G[c.dt.getMonth()]+' · '+(c.fut?'впереди':c.st.done+' выполнено'))}"></div>`}}
  /* insights */
  const wdAgg=[0,0,0,0,0,0,0],wdCnt=[0,0,0,0,0,0,0];for(let i=0;i<28;i++){const d=addDays(t0,-i);wdAgg[d.getDay()]+=dayStat(ymd(d)).done;wdCnt[d.getDay()]++}
  let bw=0;for(let i=1;i<7;i++)if(wdAgg[i]/wdCnt[i]>wdAgg[bw]/wdCnt[bw])bw=i;
  const act=S.filter(x=>x.done>0).length,avgF=act?Math.round(focus/act):0,topTag=[...tagS].sort((a,b)=>b.f-a.f)[0];
  const kpi=(c,i,l,v,sub)=>`<div class="panel kpi" style="--c:${c}"><div class="k-i">${ic(i,20)}</div><small>${l}</small><b>${v}</b>${sub}</div>`;
  const dl=x=>`<span class="s-d ${x.cls}">${x.a} ${x.t}<em>к пред. периоду</em></span>`;
  $('#v-stats').innerHTML=`<div class="v-head"><h2>Статистика</h2><div class="tabs">${[7,14,30].map(n=>`<button class="tab ${N===n?'on':''}" data-act="srSet" data-v="${n}">${n} дней</button>`).join('')}</div></div>
  <div class="kpis">${kpi('#6c8cff','tasks','Выполнено задач',done,dl(dd))}${kpi('#2fd5a0','target','Процент выполнения',rate+'%',`<span class="s-d ${rd>0?'up':rd<0?'dn':'eq'}">${rd>0?'↑ +'+rd:rd<0?'↓ −'+Math.abs(rd):'→ 0'} п.п.<em>к пред. периоду</em></span>`)}${kpi('#a56bff','clock','Время в фокусе',fmtDur(focus),dl(fd))}${kpi('#ffb547','flame','Серия дней',streak(),`<span class="s-d eq">лучший день — ${best} ${plural(best,'задача','задачи','задач')}</span>`)}</div>
  <div class="two"><div class="panel pad-p"><div class="p-head" style="margin-bottom:.4rem"><div><h2 style="font-size:1.1rem">Активность по дням</h2><p class="sub">Выполнено и запланировано</p></div><div class="lg"><span><i style="background:#6c84ff"></i>Выполнено</span><span><i style="background:rgba(91,124,255,.3)"></i>План</span></div></div><div class="bars">${bars}</div></div>
  <div class="panel pad-p"><div class="p-head" style="margin-bottom:1rem"><div><h2 style="font-size:1.1rem">По категориям</h2><p class="sub">Время в фокусе</p></div></div>${tagS.map(x=>`<div class="tg-r" style="--c:${x.color}"><span>${x.name}</span><div class="bar"><i style="width:${x.f/maxF*100}%"></i></div><small>${fmtDur(x.f)} · ${x.d}/${x.t}</small></div>`).join('')}</div></div>
  <div class="two" style="grid-template-columns:1fr 1.4fr"><div class="panel pad-p"><div class="p-head" style="margin-bottom:1rem"><div><h2 style="font-size:1.1rem">Тепловая карта</h2><p class="sub">Последние 6 недель</p></div></div><div class="heat">${heat}</div></div>
  <div style="display:flex;flex-direction:column;gap:.9rem">
   <div class="panel ins"><div class="k-i">${ic('bolt',18)}</div><p>Самый продуктивный день недели — <b>${WD[bw].toLowerCase()}</b>: в среднем ${(wdAgg[bw]/wdCnt[bw]).toFixed(1).replace('.',',')} выполненных задач за последние 4 недели.</p></div>
   <div class="panel ins"><div class="k-i">${ic('clock',18)}</div><p>В активные дни ты проводишь в фокусе в среднем <b>${fmtDur(avgF)}</b>. Активных дней за период: <b>${act} из ${N}</b>.</p></div>
   <div class="panel ins"><div class="k-i">${ic('target',18)}</div><p>${topTag&&topTag.f?`Больше всего времени уходит на категорию <b>«${topTag.name}»</b> — ${fmtDur(topTag.f)}.`:'Отмечай задачи выполненными, чтобы увидеть, на что уходит время.'}</p></div></div></div>`;
}

  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('in'));

  document.body.appendChild(p);const r=anchor.getBoundingClientRect(),pw=p.offsetWidth,ph=p.offsetHeight;
  let left=Math.max(8,Math.min(innerWidth-pw-8,r.right-pw)),top=r.bottom+6;if(top+ph>innerHeight-8)top=r.top-ph-6;
  p.style.left=left+'px';p.style.top=top+'px';requestAnimationFrame(()=>p.classList.add('in'));
  p.addEventListener('click',e=>{const b=e.target.closest('.pop-i');if(!b)return;const it=items[+b.dataset.i];closePopover();it.action()});
}

  const isNew=!p;p=p||{name:'',color:PCOLORS[0],progress:0};
  openModal(`${mHead(isNew?'Новый проект':'Редактировать проект')}<form class="m-body" id="pf" autocomplete="off"><label class="fld"><span>Название</span><input name="name" maxlength="40" required value="${esc(p.name)}" placeholder="Например, «Запуск лендинга»"></label>
   <div class="fld"><span>Цвет</span><div class="chips" id="pcol">${PCOLORS.map(c=>`<button type="button" class="chip ${p.color===c?'on':''}" data-v="${c}" style="--c:${c};width:2.2rem;height:2.2rem;padding:0;background:${c};${p.color===c?'box-shadow:0 0 0 3px rgba(255,255,255,.25)':''}"></button>`).join('')}</div></div>
   <label class="fld"><span>Прогресс: <b id="pvl">${p.progress}</b>%</span><input type="range" name="progress" min="0" max="100" step="5" value="${p.progress}" style="padding:0;accent-color:${p.color}"></label>
   <div class="m-foot"><button type="button" class="btn ghost" data-act="closeModal">Отмена</button><button class="btn primary">Сохранить</button></div></form>`,m=>{
    $('#pcol',m).addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;$$('.chip',$('#pcol',m)).forEach(x=>{x.classList.toggle('on',x===b);x.style.boxShadow=x===b?'0 0 0 3px rgba(255,255,255,.25)':''});$('[name=progress]',m).style.accentColor=b.dataset.v});
    $('[name=progress]',m).addEventListener('input',e=>$('#pvl',m).textContent=e.target.value);
    $('#pf',m).addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),d={name:String(f.get('name')).trim(),color:$('#pcol .on',m).dataset.v,progress:+f.get('progress')};
      if(!d.name)return;if(isNew)state.projects.push({id:uid(),...d});else Object.assign(p,d);save();renderAll();closeModal()});
  });
}
/* ---- settings modal ---- */
function settingsModal(){
  let pick=null;const loc=state.settings.loc;
  openModal(`${mHead('Настройки')}<form class="m-body" id="sf" autocomplete="off"><label class="fld"><span>Твоё имя</span><input name="name" maxlength="24" value="${esc(state.settings.name)}" required></label>
   <div class="fld"><span>Город для погоды (сейчас: ${esc(loc.name)})</span><div style="display:flex;gap:.6rem"><input id="cityQ" placeholder="Найти город…" style="flex:1;background:rgba(6,10,24,.6);border:1px solid var(--line);border-radius:.8rem;padding:.7rem .9rem;outline:0;color:var(--tx)"><button type="button" class="btn ghost" id="cityGo">Найти</button></div><div class="res" id="cityRes"></div></div>
   <div class="m-foot" style="justify-content:space-between"><button type="button" class="btn danger" id="resetBtn">Сбросить данные</button><div style="display:flex;gap:.7rem"><button type="button" class="btn ghost" data-act="closeModal">Отмена</button><button class="btn primary">Сохранить</button></div></div></form>`,m=>{
    const go=async()=>{const q=$('#cityQ',m).value.trim();if(!q)return;const box=$('#cityRes',m);box.innerHTML='<div class="sub">Ищу…</div>';
      try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=6&language=ru&format=json'),j=await r.json(),res=j.results||[];
        box.innerHTML=res.length?res.map((c,i)=>`<button type="button" data-i="${i}"><span>${esc(c.name)}</span><small>${esc([c.admin1,c.country].filter(Boolean).join(', '))}</small></button>`).join(''):'<div class="sub">Ничего не найдено</div>';
        box.onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=res[+b.dataset.i];pick={name:c.name,lat:c.latitude,lon:c.longitude};$$('button',box).forEach(x=>x.classList.toggle('on',x===b))};
      }catch(e){box.innerHTML='<div class="sub">Не удалось выполнить поиск — проверь подключение</div>'}};
    $('#cityGo',m).onclick=go;$('#cityQ',m).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
    let armed=false;$('#resetBtn',m).onclick=e=>{if(!armed){armed=true;e.target.textContent='Точно сбросить всё?';setTimeout(()=>{armed=false;e.target.textContent='Сбросить данные'},3500);return}
      try{localStorage.removeItem(SKEY);localStorage.removeItem(WKEY)}catch(_){}location.reload()};
    $('#sf',m).addEventListener('submit',e=>{e.preventDefault();state.settings.name=String(new FormData(e.target).get('name')).trim()||'Друг';
      const changed=pick&&(pick.lat!==loc.lat||pick.lon!==loc.lon);if(pick)state.settings.loc=pick;save();renderAll();closeModal();if(changed)refreshWeather(true);toast('Настройки сохранены')});
  });
}

/* =====================  actions  ===================== */
const A={
  nav(el){const v=el.dataset.view;ui.view=v;$$('.view').forEach(x=>x.classList.toggle('active',x.id==='v-'+v));$$('.nav-i').forEach(x=>x.classList.toggle('on',x.dataset.view===v));boot();renderAll();$('#v-'+v).scrollTop=0},
  toggleTask(el){const t=state.tasks.find(x=>x.id===el.dataset.id);if(!t)return;t.done=!t.done;save();renderAll();
    if(t.done){const l=tasksOn(t.date);if(l.length>1&&l.every(x=>x.done))toast('Все задачи дня выполнены — отличная работа! 🎉')}},
  taskMenu(el){const t=state.tasks.find(x=>x.id===el.dataset.id);if(!t)return;popover(el,[
    {label:'Редактировать',icon:'edit',action:()=>taskModal(t)},
    {label:'Перенести на завтра',icon:'swap',action:()=>{t.date=ymd(addDays(parseYmd(t.date),1));save();renderAll();toast('Перенесено на '+fmtLong(t.date))}},
    {label:'Удалить',icon:'trash',danger:1,action:()=>withUndo('Задача удалена',()=>{state.tasks=state.tasks.filter(x=>x!==t)})}])},
  addTask(){taskModal()},
  rangeMenu(el){popover(el,[['day','Сегодня'],['week','Неделя'],['month','Месяц']].map(([k,l])=>({label:l,on:ui.range===k,action:()=>{ui.range=k;renderStats()}})))},
  goals(){goalsModal()},
  pickDay(el){ui.sel=el.dataset.d;const d=parseYmd(ui.sel);ui.cal={y:d.getFullYear(),m:d.getMonth()};renderAll()},
  calPrev(){const c=ui.cal;ui.cal=c.m===0?{y:c.y-1,m:11}:{y:c.y,m:c.m-1};renderCalendar();if(ui.view==='calendar')renderCalView()},
  calNext(){const c=ui.cal;ui.cal=c.m===11?{y:c.y+1,m:0}:{y:c.y,m:c.m+1};renderCalendar();if(ui.view==='calendar')renderCalView()},
  goToday(){const n=new Date();ui.sel=todayStr;ui.cal={y:n.getFullYear(),m:n.getMonth()};renderAll()},
  toggleNote(el){const n=state.notes.find(x=>x.id===el.dataset.id);if(n){n.done=!n.done;save();renderAll()}},
  delNote(el){const n=state.notes.find(x=>x.id===el.dataset.id);if(n)withUndo('Заметка удалена',()=>{state.notes=state.notes.filter(x=>x!==n)})},
  focusNote(){$('#noteInput').focus()},
  settings(){settingsModal()},
  closeModal(){closeModal()},
  nextQuote(el,e){if(e.target.closest('.heart'))return;state.settings.q=((state.settings.q!=null?state.settings.q:Math.floor(new Date()/864e5))+1)%QUOTES.length;save();const p=$('#qText');p.style.opacity=0;setTimeout(()=>{renderHero();p.style.opacity=1},160)},
  like(){const qi=(state.settings.q!=null?state.settings.q:Math.floor(new Date()/864e5))%QUOTES.length;state.settings.likes=state.settings.likes||{};state.settings.likes[qi]=!state.settings.likes[qi];save();renderHero()},
  refreshWeather(){const c=lsGet(WKEY);if(c&&Date.now()-c.ts<60000){toast('Данные уже свежие — обновлено только что');return}refreshWeather(true)},
  tfStatus(el){ui.tf.status=el.dataset.v;renderTasksView()},
  tfTag(el){ui.tf.tag=el.dataset.v;renderTasksView()},
  nfSet(el){ui.nf=el.dataset.v;renderNotesView()},
  srSet(el){ui.sr=+el.dataset.v;renderStatsView()},
  addProject(){projectModal()},
  projMenu(el){const p=state.projects.find(x=>x.id===el.dataset.id);if(!p)return;popover(el,[{label:'Редактировать',icon:'edit',action:()=>projectModal(p)},{label:'Удалить',icon:'trash',danger:1,action:()=>withUndo('Проект удалён',()=>{state.projects=state.projects.filter(x=>x!==p)})}])},
  async fileDl(el){try{const f=await idb('readonly',s=>s.get(el.dataset.id));if(!f)return;const u=URL.createObjectURL(f.blob),a=document.createElement('a');a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){toast('Не удалось скачать файл')}},
  async fileDel(el){try{await idb('readwrite',s=>s.delete(el.dataset.id));renderFiles();toast('Файл удалён')}catch(e){}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
document.addEventListener('mousedown',e=>{if(!e.target.closest('.pop')&&!e.target.closest('[data-pop]'))closePopover()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closePopover()}});

/* forms & inputs */
function addNote(text,date){text=text.trim();if(!text)return false;state.notes.push({id:uid(),text,date,done:false,createdAt:Date.now()});save();renderAll();return true}
document.addEventListener('submit',e=>{
  if(e.target.id==='noteForm'){e.preventDefault();const i=$('#noteInput');if(addNote(i.value,ui.sel)){i.value='';$('#noteInput').focus()}}
  if(e.target.id==='noteForm2'){e.preventDefault();const i=$('#nvInput');if(addNote(i.value,todayStr))$('#nvInput').focus()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='tfq'){ui.tf.q=t.value;fillTasksList()}
  if(t.classList.contains('p-range')){const p=state.projects.find(x=>x.id===t.dataset.id);if(!p)return;p.progress=+t.value;const c=t.closest('.pcard');$('.pv',c).textContent=p.progress;$('.bar i',c).style.width=p.progress+'%';$('.pc-st',c).textContent=p.progress>=100?'Завершён':p.progress>0?'В работе':'Не начат';save()}
});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('p-range')){renderStats()}
  if(e.target.id==='fileIn'){addFiles([...e.target.files]);e.target.value=''}
});
/* inline note edit (double click) */
document.addEventListener('dblclick',e=>{
  const s=e.target.closest('[data-edit]');if(!s)return;const n=state.notes.find(x=>x.id===s.dataset.id);if(!n)return;
  s.contentEditable='true';s.focus();document.getSelection().selectAllChildren(s);
  const done=ok=>{s.contentEditable='false';const v=s.textContent.trim();if(ok&&v)n.text=v;save();renderAll()};
  s.onblur=()=>done(true);s.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();s.blur()}if(ev.key==='Escape'){s.onblur=null;done(false)}};
});
/* drag & drop files */
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.toggle('hov',ev==='dragover');if(ev==='drop')addFiles([...e.dataTransfer.files])}));
/* tooltips */
const tipEl=document.createElement('div');tipEl.className='tip';document.body.appendChild(tipEl);
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tipEl.classList.remove('in');return}tipEl.textContent=t.dataset.tip;tipEl.classList.add('in')});
document.addEventListener('mousemove',e=>{if(!tipEl.classList.contains('in'))return;let x=e.clientX+14;if(x+tipEl.offsetWidth>innerWidth-8)x=e.clientX-tipEl.offsetWidth-14;tipEl.style.left=x+'px';tipEl.style.top=Math.max(8,e.clientY-40)+'px'});
/* chart hover */
document.addEventListener('mousemove',e=>{
  const box=e.target.closest&&e.target.closest('#prodChart');if(!box||!chartPts.length)return;
  const x=e.clientX-box.getBoundingClientRect().left;let b=0,bd=1e9;chartPts.forEach((p,i)=>{const d=Math.abs(p.x-x);if(d<bd){bd=d;b=i}});if(b!==ui.hi)setHi(b);
});
document.addEventListener('mouseout',e=>{const box=e.target.closest&&e.target.closest('#prodChart');if(box&&!box.contains(e.relatedTarget)&&chartPts.length)setHi(6)});
new ResizeObserver(()=>{if(ui.view==='home')renderChart()}).observe($('#prodChart'));
window.addEventListener('resize',()=>{if(ui.view==='home')renderChart()});

/* =====================  init  ===================== */
hydrateIcons();
boot();renderAll();tick();
setInterval(tick,500);
refreshWeather();
setInterval(weatherCheck,30000);                       /* каждые 30 с проверяем: не прошло ли 60 минут */
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();weatherCheck()}});
</script>
</body>
</html>
